name: Release

# Ein Tag wie v1.2.3 baut die Windows-EXE und hängt sie an ein Release.
# Ohne Tag geht es auch: der Workflow lässt sich von Hand mit einer Version starten
# und legt den Tag dann selbst an.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version des Releases, z. B. v0.1.16'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version aus Tag oder Eingabe ableiten
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          case "$tag" in
            v*.*.*) ;;
            *) echo "Version muss der Form vX.Y.Z entsprechen: '$tag'" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: dotnet test --configuration Release

      - name: Self-contained Single-File-EXE bauen
        run: |
          dotnet publish src/Kcc.Recorder/Kcc.Recorder.csproj \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.version.outputs.version }} \
            --output publish

      - name: Dashboards als HTML-Dateien herausschreiben
        run: dotnet run --project src/Kcc.Recorder/Kcc.Recorder.csproj -c Release -- dump-dashboards --out publish

      - name: Paket schnüren
        run: |
          mkdir -p artifacts
          cp README.md publish/
          cd publish
          zip -r "../artifacts/kcc-${{ steps.version.outputs.version }}-win-x64.zip" \
            kcc.exe appsettings.json README.md dashboard.html auslastung.html verlauf.html
          cd ../artifacts
          sha256sum "kcc-${{ steps.version.outputs.version }}-win-x64.zip" > SHA256SUMS.txt

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          # Beim Handstart gibt es noch keinen Tag — der wird hier auf dem gebauten
          # Commit angelegt, mit dem Token des Workflows.
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/kcc-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
