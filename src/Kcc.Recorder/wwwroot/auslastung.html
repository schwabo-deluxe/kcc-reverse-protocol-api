<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auslastung der Ressourcenpunkte</title>
<link rel="stylesheet" href="/css/nav.css">
<link rel="stylesheet" href="/css/auslastung.css">
<script defer src="/js/glossary.js"></script>
<script defer src="/js/nav.js"></script>
<script defer src="/js/auslastung.js"></script>
</head>
<body>
<header>
  <h1>Auslastung (TSPORD)</h1>
  <label>Fenster (min) <input type="number" id="minutes" min="1" max="1440" title="Zeitraum der Verlaufskurven. Standard: UtilizationWindowMinutes"></label>
  <label>Richtwert (UPH) <input type="number" id="target" min="1" title="Bezugsgröße für Punkte ohne eigenen TargetUph. Standard: UtilizationTargetUph"></label>
  <label>Glättung (min) <input type="number" id="bucket" min="1" max="120" title="Breite des gleitenden Fensters der Verlaufskurve. Standard: UtilizationBucketMinutes"></label>
  <label>Tacho RBG (min) <input type="number" id="rate" min="1" max="240"
    title="Trailing-Fenster der RBG-Tachos (Auslastung, Leistung, Spiele/h), auf 1 h hochgerechnet. Klein = reaktiv und sprunghaft, groß = träge und ruhig. Standard: UtilizationSRMRateMinutes"></label>
  <label>Tacho FT (min) <input type="number" id="rateFt" min="1" max="240"
    title="Dasselbe für die Fördertechnik-Tachos (Punkte ohne RBG-Verbindung). Standard: UtilizationConveyorRateMinutes"></label>
  <button type="button" class="hbtn" id="arrange"
    title="Kacheln frei anordnen und skalieren; wird pro Browser gespeichert">Anordnen</button>
  <button type="button" class="hbtn" id="resetLayout" hidden>Anordnung zurücksetzen</button>
  <div class="meta" id="meta">lädt …</div>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <div id="tip" role="status"></div>
  <table>
    <thead><tr>
      <th>Ressourcenpunkt</th><th>TSPORD</th><th>UPH</th>
      <th>% vom Richtwert</th><th>Fehler</th><th>Letztes Telegramm</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
</body>
</html>
